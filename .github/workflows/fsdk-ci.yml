name: FSDK OCI CI

on:
  push:
    branches: [testing, stable]
    paths:
      - '.github/workflows/fsdk-ci.yml'
      - '.github/workflows/registry-actions.yml'
      - '.github/workflows/promote-stable.yml'
      - 'Justfile'
      - 'VERSION'
      - 'Makefile'
      - 'HP'
      - 'hplip-printer-app.c'
      - 'hplip-printer-app.1'
      - 'hplip-printer-app.service'
      - 'testpage.ps'
      - 'project.conf'
      - 'include/**'
      - 'elements/**'
      - 'files/**'
      - 'patches/oci-hplip/**'
      - 'tests/**'
  pull_request:
    branches: [testing, stable]
    paths:
      - '.github/workflows/fsdk-ci.yml'
      - '.github/workflows/registry-actions.yml'
      - '.github/workflows/promote-stable.yml'
      - 'Justfile'
      - 'VERSION'
      - 'Makefile'
      - 'HP'
      - 'hplip-printer-app.c'
      - 'hplip-printer-app.1'
      - 'hplip-printer-app.service'
      - 'testpage.ps'
      - 'project.conf'
      - 'include/**'
      - 'elements/**'
      - 'files/**'
      - 'patches/oci-hplip/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-print:
    name: FSDK image and socket-sink (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host requirements
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman
      - name: Fetch immutable sources
        run: just fetch
      - name: Build and print through real OCI image
        run: just verify
